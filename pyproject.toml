[project]
name = "news-digest"
version = "0.1.0"
description = "パーソナルニュースダイジェスト: RSS/Atomフィードを収集・要約し、Slack/Google Chatへ1日1回配信するMCPサーバー兼CLIバッチ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "mcp>=1.2.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
news-digest = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
